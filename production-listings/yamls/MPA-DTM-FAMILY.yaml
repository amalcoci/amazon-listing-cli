  description: |
    Complete family of professional-grade Deutsch DTM wire harnesses designed for sensors, electronics, and space-constrained automotive applications. Built with genuine Deutsch DTM compact connectors and premium 18 AWG GXL automotive wire, this comprehensive family delivers exceptional reliability, enhanced temperature performance, and IP68-rated protection in demanding environments while maintaining a compact footprint.

    Available in multiple pin counts (2, 3, 4, 6), connector configurations (Female-to-Female, Female-to-Male, Male-to-Male), and lengths (6-inch, 12-inch) to suit any sensor or electronics application requirement.

    KEY FEATURES
    • Genuine Deutsch DTM Series connectors - compact design
    • 18 AWG GXL wire ideal for sensor and electronics applications
    • IP68 rated when properly mated - waterproof and dustproof
    • Enhanced temperature rating: -55C to +150C
    • Gold-plated contacts for excellent corrosion resistance
    • Sensor-grade assembly built to IPC/WHMA-A-620 standards
    • Complete range of pin counts and connector configurations

    AVAILABLE CONFIGURATIONS
    • Pin Counts: 2-pin, 3-pin, 4-pin, 6-pin
    • Connector Types: Female-to-Female, Female-to-Male, Male-to-Male
    • Lengths: 6 inches, 12 inches
    • All variants sold in convenient 2-packs

    TECHNICAL SPECIFICATIONS
    • Connector System: Deutsch DTM Series (compact connectors)
    • Wire Gauge: 18 AWG GXL
    • Current Rating: 7.5A per pin
    • Voltage Rating: 600V max
    • Temperature Range: -55C to +150C
    • IP Rating: IP68 (when properly mated)

    APPLICATIONS
    • Sensor connections and instrumentation
    • Automotive electronics and control modules
    • Marine electronics in tight spaces
    • Industrial automation and robotics
    • Space-constrained engine bay applications

    QUALITY ASSURANCE
    Each harness is manufactured to IPC/WHMA-A-620 standards with rigorous quality control. All connectors are tested for proper fit and electrical continuity before packaging. ASSEMBLED IN THE USA.

