  description: |
    Complete family of professional-grade Deutsch DT wire harnesses designed for automotive, marine, and heavy-duty industrial applications. Built with genuine Deutsch DT connectors and premium 16 AWG GXL automotive wire, this comprehensive family delivers exceptional reliability, durability, and IP68-rated protection in the harshest environments.

    Available in multiple pin counts (2, 3, 4, 6), connector configurations (Female-to-Female, Female-to-Male, Male-to-Male), and lengths (6-inch, 12-inch) to suit any heavy-duty application requirement.

    KEY FEATURES
    • Genuine Deutsch DT Series connectors for maximum compatibility
    • 16 AWG GXL wire for superior durability and heat resistance
    • IP68 rated when properly mated - waterproof and dustproof
    • Vibration and shock resistant for demanding applications
    • Gold-plated contacts for excellent corrosion resistance
    • Heavy-duty assembly built to IPC/WHMA-A-620 standards
    • Complete range of pin counts and connector configurations

    AVAILABLE CONFIGURATIONS
    • Pin Counts: 2-pin, 3-pin, 4-pin, 6-pin
    • Connector Types: Female-to-Female, Female-to-Male, Male-to-Male
    • Lengths: 6 inches, 12 inches
    • All variants sold in convenient 2-packs

    TECHNICAL SPECIFICATIONS
    • Connector System: Deutsch DT Series (DT04 and DT06 connectors)
    • Wire Gauge: 16 AWG GXL (Cross-linked polyethylene insulation)
    • Wire Type: Solid core automotive wire, black color
    • Current Rating: 13A per pin
    • Voltage Rating: 600V max
    • Temperature Range: -40C to +125C
    • IP Rating: IP68 (when properly mated)

    APPLICATIONS
    • Automotive electrical systems and modifications
    • Marine electronics and navigation systems
    • Off-road vehicle lighting and accessories
    • Heavy equipment and construction machinery
    • Industrial control and automation

    QUALITY ASSURANCE
    Each harness is manufactured to IPC/WHMA-A-620 standards with rigorous quality control. All connectors are tested for proper fit and electrical continuity before packaging. ASSEMBLED IN THE USA.

